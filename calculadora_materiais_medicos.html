<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora Médica</title>
<style>
:root{color-scheme:dark;--bg:#101713;--panel:#1a241e;--line:#344339;--green:#dff3d3;--muted:#b6cbb9;--accent:#304b3b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#20372a 0,var(--bg) 60%);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f1f5ee;padding:24px 14px}.wrap{max-width:760px;margin:auto}.hero{padding:26px;border-radius:22px;background:#1c3028;border:1px solid #405649;margin-bottom:18px}.head{display:flex;gap:15px;align-items:center}.logo{width:56px;height:56px;display:grid;place-items:center;border-radius:16px;background:#304b3b;font-size:30px}h1{font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:.04em}.subtitle{color:var(--muted);margin:6px 0 0;font-size:14px}.intro{border-top:1px solid #405649;margin-top:20px;padding-top:14px;color:#d2e1d4;font-size:14px}.items{display:grid;gap:12px}.item{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:17px}.itemtop{display:flex;align-items:center;gap:12px}.emoji{width:46px;height:46px;flex-shrink:0;display:grid;place-items:center;background:#293a2f;border-radius:13px;font-size:24px}.info{flex:1;min-width:0}.name{font-weight:700}.unit{color:#a8c2ad;font-size:13px;margin-top:4px}.subtotal{text-align:right}.small{font-size:11px;color:#9aafa0}.money{color:var(--green);font-weight:750;font-size:17px;margin-top:4px}.quantity{display:flex;align-items:end;gap:8px;margin-top:15px}.field{flex:1}.field label{display:block;color:#c1cec4;font-size:13px;margin-bottom:7px}input{width:100%;padding:12px;border:1px solid #4a5d4e;border-radius:10px;background:#111a14;color:white;font-size:16px;outline:none}input:focus{border-color:#a5c69e}button{border:1px solid #4a5d4e;border-radius:10px;padding:11px 14px;background:#26372b;color:#eff8e9;font-weight:650;font-size:14px;cursor:pointer}button:hover{filter:brightness(1.15)}.adjust{display:flex;gap:6px}.adjust button{width:44px;height:44px;font-size:20px;padding:0}.total{margin-top:16px;background:#23392c;border:1px solid #58755c;border-radius:18px;padding:22px}.eyebrow{font-size:12px;color:#c2d8c2;letter-spacing:.09em}.totalnum{font-size:clamp(30px,7vw,42px);font-weight:800;color:#e0f4d3;margin:7px 0 18px}.stats{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #49654e;padding-top:15px;color:#c2d8c2}.stats strong{font-size:20px;color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}.primary{background:#d6efc8;color:#17231a;border-color:#d6efc8}.note{text-align:center;color:#91a598;font-size:12px;margin:14px 0 0}@media(max-width:430px){body{padding:14px 10px}.hero{padding:19px}.item{padding:14px}.actions{grid-template-columns:1fr}.name{font-size:15px}}
</style>
</head>
<body><main class="wrap">
<header class="hero"><div class="head"><div class="logo">🩺</div><div><h1>CALCULADORA MÉDICA</h1><p class="subtitle">Controle de materiais e valores</p></div></div><div class="intro">Informe a quantidade de cada material. Os subtotais e o valor total são calculados automaticamente.</div></header>
<section class="items" id="items"></section>
<section class="total"><div class="eyebrow">VALOR TOTAL DO PEDIDO</div><div class="totalnum" id="total">R$ 0,00</div><div class="stats"><span>Total de unidades</span><strong id="units">0</strong></div><div class="actions"><button class="primary" id="copy">▣ Copiar orçamento</button><button id="clear">↻ Limpar quantidades</button></div></section><p class="note">Calculadora automática • Valores em reais (R$)</p>
</main>
<script>
const products=[{name:'Primeiros Socorros',price:10,emoji:'🩹'},{name:'Adrenalina',price:15,emoji:'💉'},{name:'Bandagem',price:5,emoji:'🩺'},{name:'Antídoto',price:10,emoji:'🧪'}];const quantities=[0,0,0,0];const fmt=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const root=document.querySelector('#items');
products.forEach((p,i)=>{const el=document.createElement('article');el.className='item';el.innerHTML=`<div class="itemtop"><div class="emoji">${p.emoji}</div><div class="info"><div class="name">${p.name}</div><div class="unit">Valor unitário: ${fmt(p.price)}</div></div><div class="subtotal"><div class="small">Subtotal</div><div class="money" id="sub${i}">${fmt(0)}</div></div></div><div class="quantity"><div class="field"><label for="q${i}">Quantidade</label><input id="q${i}" type="number" min="0" step="1" value="0" inputmode="numeric" aria-label="Quantidade de ${p.name}"></div><div><label class="small">Ajustar</label><div class="adjust"><button type="button" data-step="-1" data-i="${i}" aria-label="Diminuir ${p.name}">−</button><button type="button" data-step="1" data-i="${i}" aria-label="Aumentar ${p.name}">+</button></div></div></div>`;root.appendChild(el);el.querySelector('input').addEventListener('input',e=>{quantities[i]=Math.max(0,Math.floor(Number(e.target.value)||0));if(e.target.value!==''&&Number(e.target.value)<0)e.target.value=0;update()})});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-step]');if(!b)return;const i=Number(b.dataset.i);quantities[i]=Math.max(0,quantities[i]+Number(b.dataset.step));document.querySelector('#q'+i).value=quantities[i];update()});function update(){let total=0,units=0;products.forEach((p,i)=>{const sub=p.price*quantities[i];total+=sub;units+=quantities[i];document.querySelector('#sub'+i).textContent=fmt(sub)});document.querySelector('#total').textContent=fmt(total);document.querySelector('#units').textContent=units}document.querySelector('#clear').addEventListener('click',()=>{quantities.fill(0);products.forEach((_,i)=>document.querySelector('#q'+i).value=0);update()});document.querySelector('#copy').addEventListener('click',async()=>{const lines=products.map((p,i)=>`${p.name} — ${fmt(p.price)} × ${quantities[i]} = ${fmt(p.price*quantities[i])}`);const total=products.reduce((s,p,i)=>s+p.price*quantities[i],0);const units=quantities.reduce((a,b)=>a+b,0);const text=`CALCULADORA MÉDICA\n\n${lines.join('\n')}\n\nTotal de unidades: ${units}\nVALOR TOTAL: ${fmt(total)}`;const btn=document.querySelector('#copy');try{await navigator.clipboard.writeText(text);btn.textContent='✓ Orçamento copiado!';}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();btn.textContent='✓ Orçamento copiado!'}setTimeout(()=>btn.textContent='▣ Copiar orçamento',1800)});update();
</script></body></html>
